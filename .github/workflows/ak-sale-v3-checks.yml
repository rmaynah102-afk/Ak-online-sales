name: AK Sale V3.5 backend checks

on:
  push:
    branches: [ak-sale-v3-review]
    paths:
      - "cloudflare/**"
      - ".github/workflows/ak-sale-v3-checks.yml"
  pull_request:
    branches: [ak-sale-v3-review]
    paths:
      - "cloudflare/**"
      - ".github/workflows/ak-sale-v3-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check cloudflare/worker.js
      - name: Run Worker authorization and provisioning tests
        run: node --test cloudflare/worker.test.mjs
