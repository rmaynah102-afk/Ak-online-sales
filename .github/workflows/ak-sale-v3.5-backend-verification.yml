name: AK Sale 3.5 Professional backend verification

on:
  push:
    branches: [ak-sale-v3-review]
    paths:
      - "cloudflare/**"
      - "v2/index.html"
      - "firestore.rules"
      - "scripts/check-v3-ui.mjs"
      - "tests/firestore/**"
      - ".github/workflows/ak-sale-v3.5-backend-verification.yml"
  pull_request:
    branches: [ak-sale-v3-review]
    paths:
      - "cloudflare/**"
      - ".github/workflows/ak-sale-v3.5-backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check cloudflare/worker.js
      - name: Check AK POS 3.5 browser UI syntax
        run: node scripts/check-v3-ui.mjs
      - name: Run Worker authorization and provisioning tests
        run: node --test cloudflare/worker.test.mjs
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firestore rules test dependencies
        working-directory: tests/firestore
        run: npm install
      - name: Run Firestore security rules tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-ak-sale-rules --config firebase.json "npm --prefix tests/firestore test"
