name: AK Sale 3.6.8 Source Verification

on:
  push:
    branches: ["fix/v3.6.8-firebase-owner-login-20261126"]
    paths:
      - "app.html"
      - "functions/**"
      - "firestore.rules"
      - "scripts/validate-firebase-contract.js"
      - "scripts/validate-apk-contract.js"
      - "tests/firestore/**"
      - ".github/workflows/ak-sale-v3.6.8-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check callable backend syntax
        run: node --check functions/index.js
      - name: Validate Firebase and POS contract
        run: node scripts/validate-firebase-contract.js
      - name: Validate APK integration contract
        run: node scripts/validate-apk-contract.js
      - name: Install Firestore rules test dependencies
        working-directory: tests/firestore
        run: npm install
      - name: Run Firestore rules tests in emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-ak-sale-368 --config tests/firestore/firebase.json "npm --prefix tests/firestore test"
