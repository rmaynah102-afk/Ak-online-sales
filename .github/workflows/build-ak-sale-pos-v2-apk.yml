name: Build AK Sale POS 2.0 Android APK

on:
  push:
    branches: [ak-sale-pos-v2-main, main, ak-pos-rebuild-1.0.5-restore, ak-pos-international-v2, ak-pos-receipts-owner-audit]
    paths:
      - "v2/**"
      - "scripts/patch-ak-apk-runtime.py"
      - "scripts/test-apk-auth-flow.js"
      - "firebase-config.js"
      - "google-services.json"
      - "firestore.rules"
      - "tests/firestore/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ak-sale-pos-v2-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - "functions/**"
      - "scripts/patch-ak-apk-runtime.py"
      - "scripts/test-apk-auth-flow.js"
      - "firebase-config.js"
      - "google-services.json"
      - "firestore.rules"
      - "tests/firestore/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ak-sale-pos-v2-apk.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a public APK release only after phone login testing passes"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare clean v2 web bundle
        run: |
          mkdir -p www
          cp v2/index.html www/index.html
          cp firebase-config.js www/firebase-config.js
          cp v2/manifest.webmanifest www/manifest.webmanifest
          cp v2/sw.js www/sw.js
          cp v2/icon.svg www/icon.svg
          mkdir -p www/vendor
          npx esbuild scripts/firebase-compat-entry.js --bundle --platform=browser --format=iife --target=es2018 --outfile=www/vendor/firebase-compat.js
          # Keep the copied Firebase config script URL intact. The old sed pattern used
          # unescaped dots and stripped the quotes from src="./firebase-config.js".
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text()
          # Bundle Firebase locally for Android WebView; avoid a permanently disabled
          # Google button when remote gstatic scripts are slow or blocked.
          old_loader = ''' await new Promise((resolve,reject)=>{const x=document.createElement("script");x.src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";x.onload=resolve;x.onerror=reject;document.head.appendChild(x)});
           await Promise.all(["firebase-auth-compat.js","firebase-firestore-compat.js","firebase-functions-compat.js"].map(name=>new Promise((resolve,reject)=>{const x=document.createElement("script");x.src="https://www.gstatic.com/firebasejs/10.12.2/"+name;x.onload=resolve;x.onerror=()=>reject(Error("Firebase SDK ဖိုင် မတင်နိုင်ပါ: "+name));const timer=setTimeout(()=>reject(Error("Firebase SDK တင်ရန် အချိန်ကျော်ပါသည်: "+name)),15000);x.onload=()=>{clearTimeout(timer);resolve()};document.head.appendChild(x)})));'''
          new_loader = ' if(typeof firebase==="undefined"||!firebase.auth||!firebase.firestore)throw Error("APK ထဲရှိ Firebase SDK မတင်နိုင်ပါ။ App ကိုပိတ်ပြီး ပြန်ဖွင့်ပါ။");'
          if old_loader not in s:
              raise SystemExit("Remote Firebase CDN loader block not found; refusing an incomplete APK bundle")
          s = s.replace(old_loader, new_loader, 1)
          script_tag = '<script src="./vendor/firebase-compat.js"></script>'
          if script_tag not in s:
              s = s.replace('</head>', script_tag + '\\n</head>', 1)
          if not (Path("www/vendor/firebase-compat.js").is_file() and Path("www/vendor/firebase-compat.js").stat().st_size > 100000):
              raise SystemExit("Locally bundled Firebase SDK is missing or unexpectedly small")
          # v2/index.html already defines the current navigation. Do not re-add removed Expenses/Printer tabs.
          required = 'window.akFirebaseBootPromise=boot().catch(e=>{ $("customerGoogleBtn").disabled=true;$("ownerGoogleBtn").disabled=true; status("Firebase စနစ်စတင်မရပါ: "+friendlyAuthError(e)+" · "+(e?.message||"")); throw e; }); window.akFirebaseBootPromise.catch(()=>{});'
          if required not in s:
              raise SystemExit("Firebase startup must fail closed and keep Google login disabled when initialization fails")
          if 'window.AK_FIREBASE_PUBLIC_CONFIG=Object.freeze({' not in s:
              raise SystemExit("Embedded Firebase public config missing from APK web bundle")
          p.write_text(s)
          print("APK-only runtime patch applied: embedded Firebase config verified; failed startup keeps Google login disabled")
          PY
          python3 scripts/patch-ak-apk-runtime.py
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ak.hardware.sales",
            "appName": "AK Sale POS 2.0",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": { "androidScheme": "https" },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          JSON
      - name: Bundle local ZXing barcode scanner before Capacitor sync
        run: node scripts/copy-zxing.js
      - name: Validate app JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('www/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(([,a])=>!/\bsrc\s*=/.test(a));
          if(!scripts.length)throw new Error('No inline JavaScript found');
          scripts.forEach(([, , code],i)=>new vm.Script(code,{filename:'v2-inline-'+(i+1)}));
          if(!html.includes('id="ownerGoogleBtn"')||!html.includes('id="customerGoogleBtn"')||!html.includes('nativeAuth.signInWithGoogle()')||!html.includes('GoogleAuthProvider.credential(idToken)')) throw new Error('Native Google-only login bridge is missing');
          if(!html.includes('window.AK_FIREBASE_PUBLIC_CONFIG=Object.freeze({')||!html.includes('projectId:"ak-onlin-sales"')) throw new Error('Embedded Firebase config is missing from APK bundle');
          if(!html.includes('<script src="./vendor/firebase-compat.js"></script>')||html.includes('https://www.gstatic.com/firebasejs/10.12.2/')) throw new Error('APK must use the locally bundled Firebase SDK, not remote CDN scripts');
          if(!html.includes("async function apkProvisionShopOwner(email,expiresOn,shopName,industryType)")||!html.includes("async function claimShopOwnerAccess(signedUser)")||!html.includes("async function claimStaffInvite(signedUser,code)")||!html.includes('providerId==="google.com"')) throw new Error("Google-only Owner/Shop Owner/Staff invitation flow is missing");
          if(/signInWithEmailAndPassword|createUserWithEmailAndPassword|sendPasswordResetEmail|id="password"|newPassword/.test(html)) throw new Error("Legacy Email/Password login controls remain");
          if(!html.includes('async function claimShopOwnerAccess(signedUser)')||!html.includes('db.collection("pendingOwnerInvites").doc(email)')||!html.includes("APK-only AK dark monochrome high-contrast theme")) throw new Error("APK-only Spark-compatible verified Gmail provisioning or theme patch is missing");
          if(!html.includes('await window.printSaleReceipt(saleRef.id)')||!html.includes('id="adBrand"')||!html.includes("ctx.fillText(brand.slice(0,32),540,105)")||!html.includes('activeShopName||"ဆိုင်အမည်"')) throw new Error("APK receipt auto-print or editable shop advertising brand patch is missing");
          if(!html.includes('["profile","products","sales","purchases","people","reports","ads","backup"]')||html.includes('data-tab="expenses"')||html.includes('data-tab="printer"')||!html.includes('id="printerInline"')||!html.includes('id="reportSheet"')||!html.includes('window.verifyExpense')) throw new Error('Unified report sheet, expense verification or inline printer layout is missing');
          if(!html.includes('window.akFirebaseBootPromise=boot().catch(')||!html.includes('if(!auth&&window.akFirebaseBootPromise)')||!html.includes('$("ownerGoogleBtn").disabled=true')) throw new Error('Google Login must wait for Firebase initialization and fail closed');
          if(!html.includes('id="saleProductSearch"')||!html.includes('id="buyProductSearch"')||!html.includes('function refreshTransactionProductOptions')||!html.includes('Viber / Share')) throw new Error('Fast sale/purchase search or transaction Viber sharing is missing');
          if(!html.includes('id="salesSearch"')||!html.includes('id="purchasesSearch"')||!html.includes('visibleSales')||!html.includes('visiblePurchases')||!html.includes('salesSummary')||!html.includes('purchasesSummary')) throw new Error('APK spreadsheet-style searchable sales/purchase ledgers are missing');
          if(!html.includes('Array.isArray(x.lines)&&x.lines.length?x.lines.map(v=>v.name).join(" ")')||!html.includes('line.qty??x.qty??0')) throw new Error('APK multi-item sale ledger/CSV details are missing');
          if(!html.includes('function isPlatformOwner')||!html.includes('AK Hardware & Electrical · Owner POS')||!html.includes('ownerControlBtn')) throw new Error('Separate Owner POS and Control Center routing is missing');
          if(!html.includes('async function akStartBarcodeScanner')||!html.includes('window.akPrintRawToDefault')||!html.includes('shareReceiptImage')||!html.includes('id="adCanvas"')||!html.includes('id="exportCsv"')) throw new Error('Barcode, native printer, social advertising or CSV/PDF modules are missing');
          const config=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          if(config.appId!=='com.ak.hardware.sales'||config.plugins?.FirebaseAuthentication?.providers?.includes('google.com')!==true) throw new Error('Capacitor Android package or Google provider config is invalid');
          if(!/if\(email===OWNER\)[\s\S]*?await loadLicenses\(\)/.test(html)) throw new Error('Platform Owner auth route does not load the Control Center licenses');
          console.log('Validated',scripts.length,'inline script block(s), Owner Google login and Owner POS contract');
          NODE
      - name: Test APK shop-owner account creation and recovery
        run: node scripts/test-apk-auth-flow.js
      - name: Run Firestore multi-tenant security rules emulator tests
        working-directory: tests/firestore
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          printf '%s\n' '{"emulators":{"firestore":{"port":8080}}}' > firebase.json
          npx firebase emulators:exec --only firestore --project demo-ak-sale-rules "npm test"
      - name: Validate native printer installer
        run: node --check scripts/install-native-printer.js
      - name: Generate Android project
        run: npx cap add android
      - name: Add Firebase Android OAuth configuration
        run: |
          test -s google-services.json
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          cfg=json.loads(Path('google-services.json').read_text())
          packages=[c['client_info']['android_client_info']['package_name'] for c in cfg['client']]
          if 'com.ak.hardware.sales' not in packages:
              raise SystemExit('google-services.json does not register com.ak.hardware.sales')
          root=Path('android/build.gradle'); app=Path('android/app/build.gradle')
          rs=root.read_text(); aps=app.read_text()
          if 'com.google.gms:google-services' not in rs:
              m=re.search(r'(dependencies\s*\{)',rs)
              if not m: raise SystemExit('Root Gradle dependencies block not found')
              rs=rs[:m.end()]+"\n        classpath 'com.google.gms:google-services:4.4.4'"+rs[m.end():]
              root.write_text(rs)
          if 'com.google.gms.google-services' not in aps:
              app.write_text(aps+"\n\napply plugin: 'com.google.gms.google-services'\n")
          variables=Path('android/variables.gradle')
          vs=variables.read_text()
          for key,value in [('rgcfaIncludeGoogle','true'),('androidxCredentialsVersion',"'1.3.0'")]:
              if not re.search(r'\b'+re.escape(key)+r'\s*=',vs):
                  m=re.search(r'(ext\s*\{)',vs)
                  if not m: raise SystemExit('variables.gradle ext block not found')
                  vs=vs[:m.end()]+'\n    '+key+' = '+value+vs[m.end():]
          variables.write_text(vs)
          print('Firebase Android package, Google Services plugin and native Google auth dependencies configured')
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Verify local barcode scanner is packaged in Android assets
        run: test -s android/app/src/main/assets/public/vendor/zxing.min.js
      - name: Set Android update-compatible version
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const run=Number(process.env.GITHUB_RUN_NUMBER||1);
          const versionCode=1000000+run;
          const versionName='2.1.'+run;
          const p='android/app/build.gradle';
          let g=fs.readFileSync(p,'utf8');
          if(!/versionCode\s+\d+/.test(g)||!/versionName\s+"[^"]+"/.test(g)) throw new Error('Android version fields not found');
          g=g.replace(/versionCode\s+\d+/,'versionCode '+versionCode);
          g=g.replace(/versionName\s+"[^"]+"/,'versionName "'+versionName+'"');
          if(!g.includes('applicationId "com.ak.hardware.sales"')) throw new Error('APK package ID is not the registered AK Sale app');
          fs.writeFileSync(p,g);
          console.log('AK Sale Android version',versionName,'code',versionCode);
          NODE
      - name: Install AK native Bluetooth / Wi-Fi printer bridge
        run: node scripts/install-native-printer.js
      - name: Generate AK Sale Android launcher icons
        run: node scripts/generate-android-icons.js
      - name: Check release signing secrets
        id: signing
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$AK_RELEASE_KEYSTORE_BASE64" ] && [ -n "$AK_RELEASE_STORE_PASSWORD" ] && [ -n "$AK_RELEASE_KEY_ALIAS" ] && [ -n "$AK_RELEASE_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; native Google sign-in may not work in a debug APK."
          fi
      - name: Configure Android release signing
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$AK_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/ak-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("ak-release.keystore")
                      storePassword System.getenv("AK_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("AK_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("AK_RELEASE_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in s:
              s, count = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if count != 1:
                  raise SystemExit("Could not find release build type")
          p.write_text(s)
          PY
      - name: Verify release certificate matches Firebase Google OAuth
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
        run: |
          ACTUAL=$(keytool -list -v -keystore app/ak-release.keystore -storepass "$AK_RELEASE_STORE_PASSWORD" -alias "$AK_RELEASE_KEY_ALIAS" | awk '/SHA1:/{print $2; exit}' | tr -d ':')
          EXPECTED=$(python3 - <<'PY'
          import json
          d=json.load(open('../google-services.json'))
          for c in d['client']:
            for o in c.get('oauth_client',[]):
              a=o.get('android_info',{})
              if a.get('package_name')=='com.ak.hardware.sales':
                print(a.get('certificate_hash','').upper()); raise SystemExit
          PY
          )
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Release signing SHA-1 does not match Firebase Android OAuth client."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Release signing SHA-1 matches Firebase Android OAuth."
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Audit the built APK payload (Google-only login)
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -p "$APK" assets/public/index.html > /tmp/ak-apk-index.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/ak-apk-index.html').read_text(encoding='utf-8')
          required=['async function signInWithGoogleAccount()', 'nativeAuth.signInWithGoogle()', 'async function claimShopOwnerAccess(signedUser)', 'async function claimStaffInvite(signedUser,code)', 'providerId==="google.com"', 'id="merchantCode"', 'pendingOwnerInvites', 'shopInvites']
          for item in required:
              if item not in h: raise SystemExit('APK payload missing: '+item)
          forbidden=['signInWithEmailAndPassword','createUserWithEmailAndPassword','sendPasswordResetEmail','id="password"','passwordLoginFields','Email Link']
          for item in forbidden:
              if item in h: raise SystemExit('APK still contains forbidden login path: '+item)
          print('PASS: final APK payload has Google-only Owner, Shop Owner and Staff login; no password/email-link login.')
          PY
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-POS-2.1-SIGNED-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create permanent public GitHub Release
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK" > android/app/build/outputs/apk/release/app-release.apk.sha256
          gh release create "v2.1.${GITHUB_RUN_NUMBER}" \
            "$APK" \
            "android/app/build/outputs/apk/release/app-release.apk.sha256" \
            --title "AK Sale POS 2.1.${GITHUB_RUN_NUMBER}" \
            --notes "AK Sale POS Android release. Install the APK on Android. SHA-256 checksum is included." \
            --latest
      - name: Build temporary debug APK when release key is unavailable
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload temporary debug APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-POS-2.0-TEST-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
