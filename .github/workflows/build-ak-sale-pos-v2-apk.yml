name: Build AK Sale POS 2.0 Android APK
on:
  push:
    branches: [ak-sale-pos-v2-main, main]
    paths:
      - "v2/**"
      - "firebase-config.js"
      - "firestore.rules"
      - "tests/firestore/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ak-sale-pos-v2-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare clean v2 web bundle
        run: |
          mkdir -p www
          cp v2/index.html www/index.html
          cp firebase-config.js www/firebase-config.js
          cp v2/manifest.webmanifest www/manifest.webmanifest
          cp v2/sw.js www/sw.js
          cp v2/icon.svg www/icon.svg
          sed -i 's#../firebase-config.js#./firebase-config.js#g' www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ak.hardware.sales.v2",
            "appName": "AK Sale POS 2.0",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": { "androidScheme": "https" }
          }
          JSON
      - name: Validate app JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('www/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(([,a])=>!/\bsrc\s*=/.test(a));
          if(!scripts.length)throw new Error('No inline JavaScript found');
          scripts.forEach(([, , code],i)=>new vm.Script(code,{filename:'v2-inline-'+(i+1)}));
          console.log('Validated',scripts.length,'inline script block(s)');
          NODE
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-POS-2.0-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
