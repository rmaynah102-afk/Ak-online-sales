name: Build AK Sale POS 2.0 Android APK

on:
  push:
    branches: [ak-sale-pos-v2-main, main, ak-pos-rebuild-1.0.5-restore]
    paths:
      - "v2/**"
      - "firebase-config.js"
      - "google-services.json"
      - "firestore.rules"
      - "tests/firestore/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ak-sale-pos-v2-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare clean v2 web bundle
        run: |
          mkdir -p www
          cp v2/index.html www/index.html
          cp firebase-config.js www/firebase-config.js
          cp v2/manifest.webmanifest www/manifest.webmanifest
          cp v2/sw.js www/sw.js
          cp v2/icon.svg www/icon.svg
          sed -i 's#../firebase-config.js#./firebase-config.js#g' www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ak.hardware.sales",
            "appName": "AK Sale POS 2.0",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": { "androidScheme": "https" },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          JSON
      - name: Bundle local ZXing barcode scanner before Capacitor sync
        run: node scripts/copy-zxing.js
      - name: Validate app JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('www/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(([,a])=>!/\bsrc\s*=/.test(a));
          if(!scripts.length)throw new Error('No inline JavaScript found');
          scripts.forEach(([, , code],i)=>new vm.Script(code,{filename:'v2-inline-'+(i+1)}));
          if(!html.includes('id="ownerGoogleBtn"')||!html.includes('nativeAuth.signInWithGoogle({skipNativeAuth:true})')||!html.includes('GoogleAuthProvider.credential(idToken)')) throw new Error('Native Google Platform Owner login bridge is missing');
          if(!html.includes('function isPlatformOwner')||!html.includes('AK Hardware & Electrical · Owner POS')||!html.includes('ownerControlBtn')) throw new Error('Separate Owner POS and Control Center routing is missing');
          if(!html.includes('async function akStartBarcodeScanner')||!html.includes('window.akPrintRawToDefault')||!html.includes('shareReceiptImage')||!html.includes('id="adCanvas"')||!html.includes('id="exportCsv"')) throw new Error('Barcode, native printer, social advertising or CSV/PDF modules are missing');
          const config=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          if(config.appId!=='com.ak.hardware.sales'||config.plugins?.FirebaseAuthentication?.providers?.includes('google.com')!==true) throw new Error('Capacitor Android package or Google provider config is invalid');
          console.log('Validated',scripts.length,'inline script block(s), Owner Google login and Owner POS contract');
          NODE
      - name: Validate native printer installer
        run: node --check scripts/install-native-printer.js
      - name: Generate Android project
        run: npx cap add android
      - name: Add Firebase Android OAuth configuration
        run: |
          test -s google-services.json
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          cfg=json.loads(Path('google-services.json').read_text())
          packages=[c['client_info']['android_client_info']['package_name'] for c in cfg['client']]
          if 'com.ak.hardware.sales' not in packages:
              raise SystemExit('google-services.json does not register com.ak.hardware.sales')
          root=Path('android/build.gradle'); app=Path('android/app/build.gradle')
          rs=root.read_text(); aps=app.read_text()
          if 'com.google.gms:google-services' not in rs:
              m=re.search(r'(dependencies\s*\{)',rs)
              if not m: raise SystemExit('Root Gradle dependencies block not found')
              rs=rs[:m.end()]+"\n        classpath 'com.google.gms:google-services:4.4.4'"+rs[m.end():]
              root.write_text(rs)
          if 'com.google.gms.google-services' not in aps:
              app.write_text(aps+"\n\napply plugin: 'com.google.gms.google-services'\n")
          variables=Path('android/variables.gradle')
          vs=variables.read_text()
          for key,value in [('rgcfaIncludeGoogle','true'),('androidxCredentialsVersion',"'1.3.0'")]:
              if not re.search(r'\b'+re.escape(key)+r'\s*=',vs):
                  m=re.search(r'(ext\s*\{)',vs)
                  if not m: raise SystemExit('variables.gradle ext block not found')
                  vs=vs[:m.end()]+'\n    '+key+' = '+value+vs[m.end():]
          variables.write_text(vs)
          print('Firebase Android package, Google Services plugin and native Google auth dependencies configured')
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Verify local barcode scanner is packaged in Android assets
        run: test -s android/app/src/main/assets/public/vendor/zxing.min.js
      - name: Set Android update-compatible version
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const run=Number(process.env.GITHUB_RUN_NUMBER||1);
          const versionCode=1000000+run;
          const versionName='2.0.'+run;
          const p='android/app/build.gradle';
          let g=fs.readFileSync(p,'utf8');
          if(!/versionCode\s+\d+/.test(g)||!/versionName\s+"[^"]+"/.test(g)) throw new Error('Android version fields not found');
          g=g.replace(/versionCode\s+\d+/,'versionCode '+versionCode);
          g=g.replace(/versionName\s+"[^"]+"/,'versionName "'+versionName+'"');
          if(!g.includes('applicationId "com.ak.hardware.sales"')) throw new Error('APK package ID is not the registered AK Sale app');
          fs.writeFileSync(p,g);
          console.log('AK Sale Android version',versionName,'code',versionCode);
          NODE
      - name: Install AK native Bluetooth / Wi-Fi printer bridge
        run: node scripts/install-native-printer.js
      - name: Generate AK Sale Android launcher icons
        run: node scripts/generate-android-icons.js
      - name: Check release signing secrets
        id: signing
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$AK_RELEASE_KEYSTORE_BASE64" ] && [ -n "$AK_RELEASE_STORE_PASSWORD" ] && [ -n "$AK_RELEASE_KEY_ALIAS" ] && [ -n "$AK_RELEASE_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; native Google sign-in may not work in a debug APK."
          fi
      - name: Configure Android release signing
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$AK_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/ak-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("ak-release.keystore")
                      storePassword System.getenv("AK_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("AK_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("AK_RELEASE_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in s:
              s, count = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if count != 1:
                  raise SystemExit("Could not find release build type")
          p.write_text(s)
          PY
      - name: Verify release certificate matches Firebase Google OAuth
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
        run: |
          ACTUAL=$(keytool -list -v -keystore app/ak-release.keystore -storepass "$AK_RELEASE_STORE_PASSWORD" -alias "$AK_RELEASE_KEY_ALIAS" | awk '/SHA1:/{print $2; exit}' | tr -d ':')
          EXPECTED=$(python3 - <<'PY'
          import json
          d=json.load(open('../google-services.json'))
          for c in d['client']:
            for o in c.get('oauth_client',[]):
              a=o.get('android_info',{})
              if a.get('package_name')=='com.ak.hardware.sales':
                print(a.get('certificate_hash','').upper()); raise SystemExit
          PY
          )
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Release signing SHA-1 does not match Firebase Android OAuth client."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Release signing SHA-1 matches Firebase Android OAuth."
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-POS-2.0-SIGNED-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build temporary debug APK when release key is unavailable
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload temporary debug APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-POS-2.0-TEST-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
