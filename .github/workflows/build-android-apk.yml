name: Build AK Sale Android APK

concurrency:
  group: ak-sale-build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  # APK is built manually only after free-tier backend checks are complete.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build one universal AK Sale APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('app.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs));
          if (!scripts.length) throw new Error('No inline JavaScript found in app.html');
          scripts.forEach((match, index) => {
            new vm.Script(match[2], { filename: 'app.html:inline-script-' + (index + 1) });
          });
          console.log('Validated', scripts.length, 'inline JavaScript blocks.');
          NODE
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run copy-web
      - name: Apply APK-only Cloud startup guard (does not modify website source)
        run: node scripts/patch-apk-cloud-startup.js
      - name: Apply APK-only POS isolation (Marketplace stays in website only)
        run: node scripts/patch-apk-pos-only.js
      - name: Apply one universal role-based APK
        run: node scripts/patch-apk-universal.js
      - name: Validate generated APK POS bundle
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const checks = [
            ['APK POS-only universal root', html.includes('<html lang="my" class="ak-apk-pos-only"') && html.includes('data-ak-apk-edition="universal"')],
            ['Marketplace hidden', 'html.ak-apk-pos-only #market'],
            ['Market navigation hidden', 'html.ak-apk-pos-only #nav button[data-view="market"]'],
            ['Owner Market promotion panel hidden', 'html.ak-apk-pos-only #akOwnerPromoPanel'],
            ['Market reports panel hidden', 'html.ak-apk-pos-only #akMarketReportsPanel'],
            ['Sponsored ads section hidden', 'html.ak-apk-pos-only #akPublicSponsoredSection'],
            ['Market product action removed', 'onclick="akSendProductToMarket()"'],
            ['Market deep-link disabled', 'public Market URL mode disabled'],
            ['Package access request panel', 'id="akAccessRequestPanel"'],
            ['Immediate locked onboarding on launch', '<body class="ak-license-locked">'],
            ['Subscription package selector', 'id="payPlan"'],
            ['Google Gmail login option', 'onclick="firebaseGoogleLogin()"'],
            ['Android native Google bridge with legacy sign-in fallback', 'nativePromise("FirebaseAuthentication","signInWithGoogle",{skipNativeAuth:true,useCredentialManager:false}'],
            ['Owner manual package grant', 'async function akGrantCustomerSubscription(uid)'],
            ['Owner access request queue', 'id="akOwnerAccessQueue"'],
            ['Email login handler', 'async function firebaseLogin()'],
            ['Email registration handler', 'async function firebaseRegister()'],
            ['Native printer bridge', 'window.akPrintRawToDefault']
          ];
          for (const marker of ['akCustomerPaymentPanel','akOwnerPaymentQueue','payScreenshot','submitPaymentRequest','paymentRequests','paymentReferences']) {
            if (html.includes(marker)) throw new Error('Obsolete in-app payment flow remains in APK bundle: ' + marker);
          }
          for (const [label, marker] of checks) {
            const present = html.includes(marker);
            if (label === 'Market product action removed') {
              if (present) throw new Error(label + ' is still visible in APK bundle');
            } else if (!present) throw new Error('APK bundle check failed: ' + label);
          }
          // Source JavaScript is syntax-checked before APK-only transformations.
          // Avoid regex-extracting generated scripts: nested receipt document.write HTML
          // makes regex stop at embedded closing-script text rather than the real boundary.
          const scriptCount = (html.match(/<script\b/gi) || []).length;
          if (scriptCount < 5) throw new Error('Generated APK bundle is missing expected application scripts');
          const actualHeadClose = html.indexOf('</head>');
          const posOnlyStyle = html.indexOf('<style id="ak-apk-pos-only">');
          if (actualHeadClose < 0 || posOnlyStyle < 0 || posOnlyStyle > actualHeadClose) {
            throw new Error('APK POS-only CSS must be inserted inside the real document head, never inside the receipt print template');
          }
          if (!html.includes('AK_APK_POS_ONLY_MARKET_ISOLATION_V5') || !html.includes('AK_APK_CLOUD_STARTUP_GUARD_V1')) {
            throw new Error('Generated APK patch markers are missing');
          }
          if (!html.includes('<option value="30">30 ရက်</option>') || !html.includes('<option value="365">365 ရက်</option>')) {
            throw new Error('APK subscription duration and amount options are missing');
          }
          if (!html.includes('Owner အတည်ပြုပြီးမှ Cloud POS အသုံးပြုခွင့်ရမည်')) {
            throw new Error('APK is missing owner-approved subscription gate messaging');
          }
          console.log('Generated APK POS bundle validated:', scriptCount, 'script tags; Market isolated; login, manual package access and printer UI present.');
          NODE
      - name: Validate universal APK role and feature isolation
        run: node scripts/validate-apk-universal.js
      - name: Validate Firebase Functions
        run: |
          npm --prefix functions install --package-lock=false
          node --check functions/index.js
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8')); console.log('Firebase Functions package.json valid')"
      - name: Validate Firebase client/server contracts and security guards
        run: node scripts/validate-apk-contract.js
      - name: Validate native printer installer
        run: node --check scripts/install-native-printer.js
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Firebase Android and Google Sign-In
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Generated Android Gradle files are missing")
          rs = root.read_text()
          if "com.google.gms:google-services" not in rs:
              match = re.search(r'(dependencies\s*\{)', rs)
              if not match:
                  raise SystemExit("Root Gradle dependencies block not found")
              rs = rs[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.4'" + rs[match.end():]
              root.write_text(rs)
          aps = app.read_text()
          if "com.google.gms.google-services" not in aps:
              aps += "\n\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(aps)
          print("Firebase Android config and Google Services Gradle plugin configured")
          variables = Path("android/variables.gradle")
          if not variables.exists():
              raise SystemExit("Capacitor variables.gradle is missing")
          vs = variables.read_text()
          required = {
              "rgcfaIncludeGoogle": "true",
              "androidxCredentialsVersion": "'1.3.0'",
          }
          for key, value in required.items():
              if not re.search(r"\b" + re.escape(key) + r"\s*=", vs):
                  match = re.search(r"(ext\s*\{)", vs)
                  if not match:
                      raise SystemExit("variables.gradle ext block not found")
                  vs = vs[:match.end()] + "\n    " + key + " = " + value + vs[match.end():]
          variables.write_text(vs)
          print("Capacitor Firebase Google Sign-In Android dependencies enabled")
          PY
      - name: Install AK native Bluetooth and Wi-Fi printer bridge
        run: node scripts/install-native-printer.js
      - name: Apply AK Sale branding and Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ak_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#07183F" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#F6C453" android:strokeWidth="2.8" android:fillColor="#00000000" android:pathData="M54,5 C81,5 103,27 103,54 C103,81 81,103 54,103 C27,103 5,81 5,54 C5,27 27,5 54,5z"/>
              <path android:strokeColor="#F6C453" android:strokeWidth="4.2" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M15,29h8l8,31h39l10,-25H28"/>
              <path android:fillColor="#F6C453" android:pathData="M35,64a4,4 0,1 0,0.1 0 M67,64a4,4 0,1 0,0.1 0"/>
              <path android:strokeColor="#F6C453" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M30,83 L42,48 L54,83 M34,72h16"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M61,48v35 M62,66l18,-18 M62,66l19,17"/>
              <path android:strokeColor="#00CFFF" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M19,91 C39,100 75,96 91,77"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, n1 = re.subn(r'android:icon="[^"]+"', 'android:icon="@drawable/ak_launcher"', s, count=1)
          s, n2 = re.subn(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ak_launcher"', s, count=1)
          if n1 != 1:
              raise SystemExit("Android launcher icon attribute was not found")
          if n2 == 0:
              s = s.replace('android:icon="@drawable/ak_launcher"', 'android:icon="@drawable/ak_launcher" android:roundIcon="@drawable/ak_launcher"', 1)
          p.write_text(s)
          print("AK Sale launcher branding applied")
          PY

      - name: Set Android app version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const run = Number(process.env.GITHUB_RUN_NUMBER || 1);
          const versionCode = 1000000 + run;
          const versionName = pkg.version + '.' + run;
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          if (!/versionCode\s+\d+/.test(gradle) || !/versionName\s+"[^"]+"/.test(gradle)) {
            throw new Error('Could not find Android versionCode/versionName in app/build.gradle');
          }
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + versionCode);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, 'versionName "' + versionName + '"');
          fs.writeFileSync(gradlePath, gradle);
          console.log('Android version:', versionName, 'code:', versionCode);
          NODE
      - name: Sync Android project
        run: npx cap sync android
      - name: Generate AK Sale Android launcher icons
        run: node scripts/generate-android-icons.js
      - name: Check release signing secrets
        id: signing
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$AK_RELEASE_KEYSTORE_BASE64" ] && [ -n "$AK_RELEASE_STORE_PASSWORD" ] && [ -n "$AK_RELEASE_KEY_ALIAS" ] && [ -n "$AK_RELEASE_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; signed release APK will be skipped."
          fi

      - name: Configure Android release signing
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$AK_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/ak-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("ak-release.keystore")
                      storePassword System.getenv("AK_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("AK_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("AK_RELEASE_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Android Gradle block not found")
              s = s.replace(marker, marker + "\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in s:
              pattern = r'(buildTypes\s*\{\s*release\s*\{)'
              s, count = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if count != 1:
                  raise SystemExit("Could not find release build type")
          p.write_text(s)
          PY

      - name: Print Android signing certificate SHA-1 for Firebase registration
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore app/ak-release.keystore -storepass "$AK_RELEASE_STORE_PASSWORD" -alias "$AK_RELEASE_KEY_ALIAS" | grep -E 'Alias name:|SHA1:|SHA-1:'

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare universal APK download files
        if: steps.signing.outputs.ready == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AK-Sale-Software.apk
          cp android/app/build/outputs/bundle/release/app-release.aab AK-Sale-Software-PlayStore.aab

      - name: Publish signed universal AK Sale APK to GitHub Release
        if: steps.signing.outputs.ready == 'true' && vars.AK_PUBLIC_APK_RELEASE_APPROVED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ak-sale-v${{ github.run_number }}
          name: AK Sale Software v${{ github.run_number }}
          files: |
            AK-Sale-Software.apk
            AK-Sale-Software-PlayStore.aab
          generate_release_notes: true
          make_latest: true

      - name: Upload signed universal APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-Software-universal-signed-release-APK
          path: |
            AK-Sale-Software.apk
            AK-Sale-Software-PlayStore.aab
          if-no-files-found: error
          retention-days: 30

      # A debug-signed APK is provided for installation/testing while the owner
      # prepares the permanent release keystore. It is NOT a production update.
      - name: Build temporary test APK when release key is not configured
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare temporary test APK
        if: steps.signing.outputs.ready != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AK-Sale-Software-TEST-DEBUG.apk

      - name: Upload temporary test APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-Software-TEST-DEBUG-APK
          path: AK-Sale-Software-TEST-DEBUG.apk
          if-no-files-found: error
          retention-days: 30
