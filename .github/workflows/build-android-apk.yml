name: Build AK Sale Android APK

concurrency:
  group: ak-sale-build-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'ak-logo.svg'
      - 'USER-GUIDE-*.md'
      - 'BUSINESS-GUIDE-*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs));
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((match, index) => {
            new vm.Script(match[2], { filename: 'index.html:inline-script-' + (index + 1) });
          });
          console.log('Validated', scripts.length, 'inline JavaScript blocks.');
          NODE
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run copy-web
      - name: Validate Firebase Functions
        run: |
          npm --prefix functions install --package-lock=false
          node --check functions/index.js
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8')); console.log('Firebase Functions package.json valid')"
      - name: Validate Firebase client/server contracts and security guards
        run: node scripts/validate-firebase-contract.js
      - name: Generate Android project
        run: npx cap add android
      - name: Apply AK Sale branding and Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ak_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#07183F" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#F6C453" android:strokeWidth="2.8" android:fillColor="#00000000" android:pathData="M54,5 C81,5 103,27 103,54 C103,81 81,103 54,103 C27,103 5,81 5,54 C5,27 27,5 54,5z"/>
              <path android:strokeColor="#F6C453" android:strokeWidth="4.2" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M15,29h8l8,31h39l10,-25H28"/>
              <path android:fillColor="#F6C453" android:pathData="M35,64a4,4 0,1 0,0.1 0 M67,64a4,4 0,1 0,0.1 0"/>
              <path android:strokeColor="#F6C453" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M30,83 L42,48 L54,83 M34,72h16"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M61,48v35 M62,66l18,-18 M62,66l19,17"/>
              <path android:strokeColor="#00CFFF" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M19,91 C39,100 75,96 91,77"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, n1 = re.subn(r'android:icon="[^"]+"', 'android:icon="@drawable/ak_launcher"', s, count=1)
          s, n2 = re.subn(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ak_launcher"', s, count=1)
          if n1 != 1:
              raise SystemExit("Android launcher icon attribute was not found")
          if n2 == 0:
              s = s.replace('android:icon="@drawable/ak_launcher"', 'android:icon="@drawable/ak_launcher" android:roundIcon="@drawable/ak_launcher"', 1)
          p.write_text(s)
          print("AK Sale launcher branding applied")
          PY

      - name: Set Android app version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const run = Number(process.env.GITHUB_RUN_NUMBER || 1);
          const versionCode = 1000000 + run;
          const versionName = pkg.version + '.' + run;
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          if (!/versionCode\s+\d+/.test(gradle) || !/versionName\s+"[^"]+"/.test(gradle)) {
            throw new Error('Could not find Android versionCode/versionName in app/build.gradle');
          }
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + versionCode);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, 'versionName "' + versionName + '"');
          fs.writeFileSync(gradlePath, gradle);
          console.log('Android version:', versionName, 'code:', versionCode);
          NODE
      - name: Sync Android project
        run: npx cap sync android
      - name: Generate AK Sale Android launcher icons
        run: node scripts/generate-android-icons.js
      - name: Check release signing secrets
        id: signing
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$AK_RELEASE_KEYSTORE_BASE64" ] && [ -n "$AK_RELEASE_STORE_PASSWORD" ] && [ -n "$AK_RELEASE_KEY_ALIAS" ] && [ -n "$AK_RELEASE_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; signed release APK will be skipped."
          fi

      - name: Configure Android release signing
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_KEYSTORE_BASE64: ${{ secrets.AK_RELEASE_KEYSTORE_BASE64 }}
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$AK_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/ak-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("ak-release.keystore")
                      storePassword System.getenv("AK_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("AK_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("AK_RELEASE_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Android Gradle block not found")
              s = s.replace(marker, marker + "\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in s:
              pattern = r'(buildTypes\s*\{\s*release\s*\{)'
              s, count = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if count != 1:
                  raise SystemExit("Could not find release build type")
          p.write_text(s)
          PY

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AK_RELEASE_STORE_PASSWORD: ${{ secrets.AK_RELEASE_STORE_PASSWORD }}
          AK_RELEASE_KEY_ALIAS: ${{ secrets.AK_RELEASE_KEY_ALIAS }}
          AK_RELEASE_KEY_PASSWORD: ${{ secrets.AK_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare browser download filename
        if: steps.signing.outputs.ready == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AK-Sale-Software.apk
          cp android/app/build/outputs/bundle/release/app-release.aab AK-Sale-Software-PlayStore.aab

      - name: Publish signed APK to GitHub Release
        if: steps.signing.outputs.ready == 'true' && vars.AK_PUBLIC_APK_RELEASE_APPROVED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ak-v${{ github.run_number }}
          name: AK Sale Software v${{ github.run_number }}
          files: |
            AK-Sale-Software.apk
            AK-Sale-Software-PlayStore.aab
          generate_release_notes: true
          make_latest: true

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-Software-signed-release-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # A debug-signed APK is provided for installation/testing while the owner
      # prepares the permanent release keystore. It is NOT a production update.
      - name: Build temporary test APK when release key is not configured
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare temporary test APK
        if: steps.signing.outputs.ready != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AK-Sale-Software-TEST-DEBUG.apk

      - name: Upload temporary test APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-Software-TEST-DEBUG-APK
          path: AK-Sale-Software-TEST-DEBUG.apk
          if-no-files-found: error
          retention-days: 30
