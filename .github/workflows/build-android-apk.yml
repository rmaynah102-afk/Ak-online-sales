name: Build AK Sale Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run copy-web
      - name: Generate Android project
        run: npx cap add android
      - name: Set Android app version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const run = Number(process.env.GITHUB_RUN_NUMBER || 1);
          const versionCode = 1000000 + run;
          const versionName = pkg.version + '.' + run;
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          if (!/versionCode\\s+\\d+/.test(gradle) || !/versionName\\s+"[^"]+"/.test(gradle)) {
            throw new Error('Could not find Android versionCode/versionName in app/build.gradle');
          }
          gradle = gradle.replace(/versionCode\\s+\\d+/, 'versionCode ' + versionCode);
          gradle = gradle.replace(/versionName\\s+"[^"]+"/, 'versionName "' + versionName + '"');
          fs.writeFileSync(gradlePath, gradle);
          console.log('Android version:', versionName, 'code:', versionCode);
          NODE
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK-Sale-Software-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
