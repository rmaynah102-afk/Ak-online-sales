name: Deploy AK Sale Firebase Functions (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to publish Firebase Functions to production"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Functions source
        run: node --check functions/index.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Functions only
        run: firebase deploy --only functions --project ak-onlin-sales --non-interactive
