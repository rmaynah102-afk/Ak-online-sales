name: Deploy AK Sale POS Firestore Rules

on:
  push:
    branches:
      - ak-pos-international-v2
    paths:
      - 'firestore.rules'
      - '.github/workflows/deploy-ak-pos-firestore-rules.yml'

permissions:
  contents: read

concurrency:
  group: ak-sale-pos-firestore-rules
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POS source
        uses: actions/checkout@v4

      - name: Validate Firestore rules file
        run: |
          test -s firestore.rules
          grep -q "function isVerifiedGoogleUser()" firestore.rules
          grep -q "request.auth.token.firebase.sign_in_provider == 'google.com'" firestore.rules

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules only
        run: firebase deploy --only firestore:rules --project ak-onlin-sales --non-interactive
