name: Deploy AK Sale Cloudflare Backend

on:
  push:
    branches:
      - ak-cloudflare-backend-deploy
      - ak-owner-provision-backend
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy AK Sale owner-provision backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker files
        run: |
          test -s cloudflare/worker.js
          test -s cloudflare/wrangler.toml
          node --check cloudflare/worker.js
          node --test cloudflare/worker.test.mjs

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Normalize Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | xargs)"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Cloudflare credentials are empty after normalization"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN_CLEAN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID_CLEAN=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Upload Worker through Cloudflare Script API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ak-sale-backend" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form 'metadata={"main_module":"worker.js","compatibility_date":"2026-11-12"};type=application/json' \
            --form 'worker.js=@cloudflare/worker.js;filename=worker.js;type=application/javascript+module')"
          printf '%s' "$RESPONSE" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              if (!j.success) {
                for (const e of (j.errors || [])) console.error("Cloudflare API error", e.code, e.message);
                process.exit(1);
              }
              console.log("Worker upload successful:", j.result && j.result.id);
            });
          '

      - name: Verify deployed Worker health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://ak-sale-backend.painglin102.workers.dev/health" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              console.log("Worker health:", j.status || "unknown");
              console.log("Firebase service account configured:", Boolean(j.serviceAccountConfigured));
              if (!j.ok) process.exit(1);
            });
          '
