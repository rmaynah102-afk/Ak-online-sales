name: Deploy AK Sale POS 2.0 staff functions
on:
  push:
    branches: [ak-sale-pos-v2-main]
    paths:
      - "functions/index.js"
      - "functions/package.json"
      - ".github/workflows/deploy-pos-v2-staff-functions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firebase Functions syntax
        run: node --check functions/index.js
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Merchant Code staff functions
        run: firebase deploy --only functions:createMerchantCodeStaff,functions:resolveMerchantCodeLogin,functions:listMerchantCodeStaff,functions:removeMerchantCodeStaff --project ak-onlin-sales --non-interactive
