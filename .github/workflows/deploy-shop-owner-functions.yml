name: Deploy AK Shop Owner Account Functions

on:
  push:
    branches:
      - ak-pos-rebuild-1.0.5-restore
    paths:
      - 'functions/index.js'
      - 'functions/package.json'
      - '.github/workflows/deploy-shop-owner-functions.yml'

permissions:
  contents: read

concurrency:
  group: ak-shop-owner-functions-production
  cancel-in-progress: false

jobs:
  deploy-shop-owner-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved POS branch
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required account functions
        run: |
          node --check functions/index.js
          node - <<'NODE'
          const source = require('fs').readFileSync('functions/index.js', 'utf8');
          for (const name of ['createShopOwnerAccount', 'claimOwnerProvisioning']) {
            if (!new RegExp('exports\\\\.' + name + '\\\\s*=').test(source)) {
              throw new Error('Missing required export: ' + name);
            }
          }
          console.log('Shop-owner account function exports verified.');
          NODE

      - name: Install Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Authenticate to Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only shop-owner account functions
        run: firebase deploy --only functions:createShopOwnerAccount,functions:claimOwnerProvisioning --project ak-onlin-sales --non-interactive
