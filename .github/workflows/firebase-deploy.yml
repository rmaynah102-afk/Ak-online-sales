name: Deploy AK Commerce to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'global.html'
      - 'community.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'functions/**'
      - '.firebaserc'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_storage_rules:
        description: 'Deploy Storage Rules after the Firebase Storage bucket is created'
        required: true
        type: boolean
        default: false
      deploy_cloud_functions:
        description: 'Deploy Cloud Functions only after owner approval of possible Blaze billing'
        required: true
        type: boolean
        default: false

concurrency:
  group: ak-commerce-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Hosting and Firestore rules/indexes
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project ak-onlin-sales --non-interactive

      - name: Deploy Storage Rules (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_storage_rules
        run: firebase deploy --only storage --project ak-onlin-sales --non-interactive

      - name: Deploy Cloud Functions (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloud_functions
        run: firebase deploy --only functions --project ak-onlin-sales --non-interactive
