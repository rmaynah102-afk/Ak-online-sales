name: Deploy AK Free Firebase Resources

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'global.html'
      - 'community.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.firebaserc'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ak-free-firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate app JavaScript before deployment
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const pages = ['index.html', 'app.html', 'global.html', 'community.html'];
          let checked = 0;
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            const scripts = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi)]
              .filter(([, attrs]) => !/\\bsrc\\s*=/.test(attrs));
            scripts.forEach((match, index) => {
              new vm.Script(match[2], {filename: page + ':inline-' + (index + 1)});
              checked++;
            });
          }
          if (!checked) throw new Error('No inline JavaScript found');
          console.log('JavaScript syntax OK:', checked, 'inline script block(s) across', pages.length, 'pages');
          NODE

      - name: Deploy only Hosting and Firestore rules/indexes (no Storage or Functions)
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project ak-onlin-sales --non-interactive
