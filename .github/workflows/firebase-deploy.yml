name: Deploy AK Free Firebase Resources

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'global.html'
      - 'community.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.firebaserc'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ak-free-firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only Hosting and Firestore rules/indexes (no Storage or Functions)
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project ak-onlin-sales --non-interactive
