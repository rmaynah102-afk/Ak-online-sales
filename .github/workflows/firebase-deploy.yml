name: Deploy AK Sale POS Firestore Security Rules

on:
  push:
    branches: [main, ak-pos-international-v2]
    paths:
      - 'index.html'
      - 'app.html'
      - 'global.html'
      - 'community.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'tests/firestore/**'
      - 'firestore.indexes.json'
      - '.firebaserc'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ak-pos-firestore-rules-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore rules test dependencies
        run: npm install --no-save firebase@10.12.2 @firebase/rules-unit-testing@3 mocha

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Test Firestore access rules in the Emulator
        run: firebase emulators:exec --only firestore --project demo-ak-sale-rules "npx mocha tests/firestore/firestore.rules.test.js"

      - name: Validate app JavaScript before deployment
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const pages = ['index.html', 'app.html', 'global.html', 'community.html'];
          let checked = 0;
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs));
            scripts.forEach((match, index) => {
              new vm.Script(match[2], {filename: page + ':inline-' + (index + 1)});
              checked++;
            });
          }
          if (!checked) throw new Error('No inline JavaScript found');
          console.log('JavaScript syntax OK:', checked, 'inline script block(s) across', pages.length, 'pages');
          NODE

      - name: Deploy Spark-compatible Firestore rules and indexes only
        run: firebase deploy --only firestore:rules,firestore:indexes --project ak-onlin-sales --non-interactive
