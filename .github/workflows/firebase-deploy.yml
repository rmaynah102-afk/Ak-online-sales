name: Deploy AK Commerce to Firebase
concurrency:
  group: ak-commerce-production-deploy
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'global.html'
      - 'community.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'functions/**'
      - '.firebaserc'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy hosting, Firestore rules, Storage rules and Cloud Functions
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes,storage,functions --project ak-onlin-sales --non-interactive
