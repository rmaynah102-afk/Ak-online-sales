name: Deploy AK Sale Firebase Resources

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase service account secret
        id: auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json, os
          key=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          email=key.get("client_email","")
          print("Deployment service account: "+email)
          if not email or not email.endswith(".iam.gserviceaccount.com"):
              raise SystemExit("Service-account client_email is missing or invalid")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("service_account_email="+email+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### Firebase deployment\n")
              f.write("Deployment service account: "+email+"\n\n")
              f.write("Owner confirmed Firebase Blaze billing. Private key is never printed.\n")
          PY
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase deployment NOT performed. Add FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES in GitHub Actions secrets."
            {
              echo "### Firebase deployment not performed"
              echo "The workflow itself completed, but no Firebase resources were deployed because the required secret is missing."
              echo "Required secret: `FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.auth.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        if: steps.auth.outputs.available == 'true'
        run: npm install --global firebase-tools

      - name: Validate config and deploy Firebase Hosting
        if: steps.auth.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          python3 - <<'PYCONFIG'
          import json, pathlib
          config = json.loads(pathlib.Path("firebase.json").read_text(encoding="utf-8"))
          print("Firebase deployment configuration and rule files validated.")
          PYCONFIG
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          python3 - "$KEY_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              key = json.load(handle)
          required = ("type", "project_id", "private_key", "client_email")
          missing = [name for name in required if not key.get(name)]
          if missing:
              raise SystemExit("Service-account JSON is missing required fields: " + ", ".join(missing))
          if key["project_id"] != "ak-onlin-sales":
              raise SystemExit("Service-account project_id does not match ak-onlin-sales")
          print("Service-account JSON structure and project ID validated.")
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase deploy --only hosting --project ak-onlin-sales --non-interactive
          {
            echo "### Firebase Hosting"
            echo "Hosting deployment completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt Firestore Rules deployment
        id: rules
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/firebase-service-account-rules.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase deploy --only firestore:rules --project ak-onlin-sales --non-interactive
          echo "Firestore Rules deployment succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Rules deployment limitation
        if: steps.auth.outputs.available == 'true' && steps.rules.outcome == 'failure'
        run: |
          echo "Firestore Rules were not deployed. Grant Firebase Rules Admin (roles/firebaserules.admin) to the deployment service account, then rerun." >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt Storage Rules deployment
        id: storage_rules
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/firebase-service-account-storage.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase deploy --only storage --project ak-onlin-sales --non-interactive
          echo "Storage Rules deployment succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Storage deployment limitation
        if: steps.auth.outputs.available == 'true' && steps.storage_rules.outcome == 'failure'
        run: |
          echo "Storage Rules were not deployed. Grant Cloud Storage for Firebase Admin (roles/firebasestorage.admin) to the deployment service account. Initialize the default Firebase Storage bucket in Firebase Console if it does not exist, then rerun." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Cloud Functions (owner confirmed Firebase Blaze)
        id: functions
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/firebase-service-account-functions.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase deploy --only functions --project ak-onlin-sales --non-interactive
          echo "Cloud Functions deployment succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Cloud Functions deployment limitation
        if: steps.auth.outputs.available == 'true' && steps.functions.outcome == 'failure'
        run: |
          {
            echo "### Cloud Functions deployment blocked by Google Cloud IAM"
            echo "Grant the deployment service account Cloud Functions Admin (roles/cloudfunctions.admin), Service Account User (roles/iam.serviceAccountUser), and Service Usage Admin (roles/serviceusage.serviceUsageAdmin) to enable required APIs."
            echo "Enable Artifact Registry, Cloud Build, Cloud Functions, Cloud Run and Cloud Logging APIs."
            echo "Verify the Cloud Build service account has its required build role."
            echo "After IAM/API access is corrected, rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

