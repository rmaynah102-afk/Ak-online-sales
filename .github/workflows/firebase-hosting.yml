name: Deploy AK Sale Firebase Resources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase service account secret
        id: auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json, os
          key=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          email=key.get("client_email","")
          print("Deployment service account: "+email)
          if not email or not email.endswith(".iam.gserviceaccount.com"):
              raise SystemExit("Service-account client_email is missing or invalid")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("service_account_email="+email+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### Firebase deployment\n")
              f.write("Deployment service account: "+email+"\n\n")
              f.write("Service-account credentials validated. This does not grant billing consent; Cloud Functions and Storage Rules remain disabled until separately approved. Private key is never printed.\n")
          PY
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase deployment NOT performed. Add FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES in GitHub Actions secrets."
            {
              echo "### Firebase deployment not performed"
              echo "The workflow itself completed, but no Firebase resources were deployed because the required secret is missing."
              echo "Required secret: `FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.auth.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate app JavaScript before deployment
        if: steps.auth.outputs.available == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const pages = ['index.html', 'app.html', 'global.html', 'community.html'];
          let checked = 0;
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs));
            scripts.forEach((match, index) => {
              new vm.Script(match[2], {filename: page + ':inline-' + (index + 1)});
              checked++;
            });
          }
          if (!checked) throw new Error('No inline JavaScript found');
          console.log('JavaScript syntax OK:', checked, 'inline script block(s) across', pages.length, 'pages');
          NODE

      - name: Install Firebase CLI
        if: steps.auth.outputs.available == 'true'
        run: npm install --global firebase-tools

      - name: Validate config and deploy Firebase Hosting
        if: steps.auth.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          python3 - <<'PYCONFIG'
          import json, pathlib
          config = json.loads(pathlib.Path("firebase.json").read_text(encoding="utf-8"))
          print("Firebase deployment configuration and rule files validated.")
          PYCONFIG
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          python3 - "$KEY_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              key = json.load(handle)
          required = ("type", "project_id", "private_key", "client_email")
          missing = [name for name in required if not key.get(name)]
          if missing:
              raise SystemExit("Service-account JSON is missing required fields: " + ", ".join(missing))
          if key["project_id"] != "ak-onlin-sales":
              raise SystemExit("Service-account project_id does not match ak-onlin-sales")
          print("Service-account JSON structure and project ID validated.")
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase deploy --only hosting --project ak-onlin-sales --non-interactive
          {
            echo "### Firebase Hosting"
            echo "Hosting deployment completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Firestore Rules and Indexes
        id: rules
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/firebase-service-account-rules.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          firebase deploy --only firestore --project ak-onlin-sales --non-interactive
          echo "Firestore Rules and Indexes deployment succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Rules deployment limitation
        if: steps.auth.outputs.available == 'true' && steps.rules.outcome == 'failure'
        run: |
          echo "Firestore Rules or Indexes were not deployed. Grant the required Firestore Rules Admin and Cloud Datastore Index Admin permissions to the deployment service account, then rerun." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm free-tier deployment scope
        if: steps.auth.outputs.available == 'true'
        run: |
          {
            echo "### Free-tier deployment scope"
            echo "Only Firebase Hosting and Firestore Rules/Indexes are deployed."
            echo "Firebase Storage and Cloud Functions are intentionally not deployed; no paid plan or billing is enabled by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
