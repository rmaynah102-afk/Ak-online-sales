name: AK Sale Spark Backend Security and Adapter Tests

on:
  pull_request:
    branches: [main, ak-free-backend-migration]
    paths:
      - 'firestore.rules'
      - 'tests/firestore/**'
      - 'apk/spark-pos-store.js'
      - 'spark-pos-store.js'
      - 'app.html'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/firestore-rules-tests.yml'
  push:
    branches: [ak-free-backend-migration]
    paths:
      - 'firestore.rules'
      - 'tests/firestore/**'
      - '.github/workflows/firestore-rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm --prefix tests/firestore install
      - name: Run Spark POS adapter unit tests
        run: node tests/firestore/spark-pos-store.test.js
      - name: Run Firestore emulator security tests
        run: |
          ./tests/firestore/node_modules/.bin/firebase emulators:exec \
            --project demo-ak-sale-rules --only firestore \
            "./tests/firestore/node_modules/.bin/mocha tests/firestore/firestore.rules.test.js"
