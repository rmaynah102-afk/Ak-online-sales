name: Test AK Sale POS 2.0 Firestore rules
on:
  push:
    branches: [ak-sale-pos-v2-main, main]
    paths:
      - "firestore.rules"
      - "tests/firestore/**"
      - ".github/workflows/test-deploy-pos-v2-rules.yml"
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "tests/firestore/**"
      - ".github/workflows/test-deploy-pos-v2-rules.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated test dependencies
        run: npm --prefix tests/firestore install
      - name: Run POS adapter unit tests
        run: node tests/firestore/spark-pos-store.test.js
      - name: Run Firestore emulator security tests
        run: |
          ./tests/firestore/node_modules/.bin/firebase emulators:exec \
            --project demo-ak-sale-rules --only firestore \
            "./tests/firestore/node_modules/.bin/mocha tests/firestore/firestore.rules.test.js"
      - name: Authenticate Firebase deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_ONLIN_SALES }}
      - name: Install Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global firebase-tools
      - name: Deploy tested Firestore rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --only firestore:rules --project ak-onlin-sales --non-interactive
