<div class="printer-highlight" id="akV2LabelStudio" style="margin-top:14px">
<h3>Barcode Label / Sticker Printer</h3>
<p class="muted">ကုန်ပစ္စည်း SKU / Barcode ကို အသုံးပြုပြီး Label စာရွက်အရွယ်အစား၊ အတန်းနှင့် အရေအတွက် ရွေးချယ်ပုံနှိပ်ရန်။</p>
<div class="grid">
<div><label>ပစ္စည်းရွေးရန်</label><select id="akV2LabelProduct"><option value="">ပစ္စည်းရွေးပါ</option></select></div>
<div><label>Label အရွယ်အစား</label><select id="akV2LabelSize"><option value="30x20">30 × 20 mm</option><option value="40x30">40 × 30 mm</option><option value="50x30">50 × 30 mm</option><option value="60x40">60 × 40 mm</option></select></div>
<div><label>တစ်တန်းအရေအတွက်</label><select id="akV2LabelColumns"><option value="1">1 ကော်လံ</option><option value="2">2 ကော်လံ</option><option value="3">3 ကော်လံ</option></select></div>
<div><label>ထုတ်မည့်အရေအတွက်</label><input id="akV2LabelCopies" type="number" min="1" max="300" value="1"></div>
<div><label>Label ကြားအကွာ (mm)</label><input id="akV2LabelGap" type="number" min="0" max="10" step="0.5" value="2"></div>
<div><label>ဘယ်/ညာညှိ (mm)</label><input id="akV2LabelOffsetX" type="number" min="-20" max="20" step="0.5" value="0"></div>
<div><label>အပေါ်/အောက်ညှိ (mm)</label><input id="akV2LabelOffsetY" type="number" min="-20" max="20" step="0.5" value="0"></div>
<div><label>စာသားတည်နေရာ</label><select id="akV2LabelAlign"><option value="center">အလယ်</option><option value="left">ဘယ်</option><option value="right">ညာ</option></select></div>
</div>
<div class="row" style="flex-wrap:wrap;margin-top:8px">
<label><input id="akV2LabelShowName" type="checkbox" checked> ပစ္စည်းအမည်</label>
<label><input id="akV2LabelShowPrice" type="checkbox" checked> ရောင်းဈေး</label>
<label><input id="akV2LabelShowCode" type="checkbox" checked> Barcode နံပါတ်</label>
</div>
<div class="row"><button type="button" class="secondary" onclick="akRefreshV2LabelProducts()">ပစ္စည်းစာရင်း ပြန်ဖတ်</button><button type="button" onclick="akPrintV2Labels()">Sticker Print</button></div>
<p class="muted" id="akV2LabelStatus">Code 39 Barcode ကို ထုတ်ပေးမည်။ Barcode အက္ခရာ/ဂဏန်းနှင့် - . space $ / + % ကို ထောက်ပံ့သည်။</p>
</div>
