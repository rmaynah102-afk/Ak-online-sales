<meta name="description" content="AK Sale POS, AK Market, Community and Global business tools for Myanmar.">
<link rel="canonical" href="https://rmaynah102-afk.github.io/Ak-online-sales/">
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var hash = window.location.hash;
  var target;
  if (params.has("app")) {
    target = new URL("./app.html", window.location.href);
  } else {
    if (params.has("market")) {
      target = new URL("./market-v2.html", window.location.href);
    } else {
      target = new URL("./home.html", window.location.href);
    }
  }
  target.search = params.toString();
  target.hash = hash;
  window.location.replace(target.toString());
})();
</script>
