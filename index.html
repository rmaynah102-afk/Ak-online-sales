<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--navy:#091a36;--blue:#1d63cf;--gold:#f2c15e;--ink:#182b46;--muted:#6c7d94;--line:#dce5f0;--paper:#f3f6fb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif}
header{height:64px;background:linear-gradient(110deg,#07152e,#12427f);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;box-shadow:0 3px 16px #07152e30;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;color:white;text-decoration:none;min-width:0}.brand img{width:38px;height:38px}.brand strong{font-size:17px;letter-spacing:.3px;white-space:nowrap}.brand small{display:block;color:#d2e1f5;font-size:9px;letter-spacing:1.2px}
.live{font-size:11px;color:#f8d98e;white-space:nowrap}
nav{display:flex;height:48px;align-items:center;gap:5px;overflow-x:auto;white-space:nowrap;padding:5px 12px;background:white;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;border-radius:9px;background:transparent;color:#50627b;font:700 12px system-ui;padding:9px 13px;cursor:pointer;min-height:38px}
nav button.active{background:#e9f1ff;color:#164f9e}
nav button:hover{background:#f0f4fa}
main{height:calc(100dvh - 112px);height:calc(100vh - 112px);position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:#f3f6fb}
#fallback{display:none;position:absolute;inset:0;background:white;padding:24px;z-index:2}
@media(max-width:650px){
 header{height:58px;padding:0 12px}.brand img{width:34px;height:34px}.brand strong{font-size:15px}.live{font-size:10px}
 nav{height:48px;padding:4px 7px;gap:2px}nav button{font-size:11px;padding:8px 10px}
 main{height:calc(100dvh - 106px);height:calc(100vh - 106px)}
}
</style>
</head>
<body>
<header>
 <a class="brand" href="./" aria-label="AK Commerce home"><img src="./ak-logo.svg" alt=""><span><strong>AK MARKET</strong><small>MYANMAR ONLINE SHOPPING</small></span></a>
 <div class="live">● LIVE BUSINESS NETWORK</div>
</header>
<nav aria-label="Main navigation" id="tabs">
 <button data-view="market" class="active">ဈေးကွက် / Market</button>
 <button data-view="pos">ဆိုင်စီမံခန့်ခွဲမှု / POS</button>
 <button data-view="trade">Global Trade</button>
 <button data-view="community">Community</button>
 <button data-view="ads">ကြော်ငြာ / Ads</button>
 <button data-view="download">APK</button>
</nav>
<main>
 <iframe id="workspace" title="AK Commerce workspace" src="./app.html?market=1#market" allow="clipboard-read; clipboard-write; payment" referrerpolicy="strict-origin-when-cross-origin"></iframe>
 <div id="fallback"><h2>AK Commerce ကို ဖွင့်မရသေးပါ</h2><p>အင်တာနက်ချိတ်ဆက်မှုကို စစ်ပြီး ပြန်ဖွင့်ပါ။</p><a href="./app.html?market=1#market">Marketplace ကို တိုက်ရိုက်ဖွင့်ရန်</a></div>
</main>
<script>
const pages={
 market:"./app.html?market=1#market",
 pos:"./app.html",
 trade:"./global.html",
 community:"./community.html",
 ads:"./global.html#advertise",
 download:"./download.html"
};
const frame=document.getElementById("workspace"),buttons=[...document.querySelectorAll("[data-view]")];
function setView(view,write=true){
 if(!pages[view])view="market";
 frame.src=pages[view];
 buttons.forEach(b=>{const on=b.dataset.view===view;b.classList.toggle("active",on);b.setAttribute("aria-current",on?"page":"false")});
 if(write){const u=new URL(location.href);u.searchParams.set("view",view);history.replaceState(null,"",u.pathname+u.search)}
}
buttons.forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
frame.addEventListener("load",()=>document.getElementById("fallback").style.display="none");
frame.addEventListener("error",()=>document.getElementById("fallback").style.display="block");
const requested=new URLSearchParams(location.search).get("view");
if(requested&&pages[requested])setView(requested,false);
// Preserve the shared AK PWA service worker and offline caches.
</script>
</body></html>
